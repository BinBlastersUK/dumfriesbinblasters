<style>
/* BRAND COLOURS */
:root{
  --bg:#ffeb00;
  --tint:#fff27a;
  --text:#111827;
  --green:#0f7a37;
}

*{box-sizing:border-box;}
body{
  margin:0;
  font-family:'Inter',sans-serif;
  background:var(--bg);
  color:var(--text);
}

/* GLOBAL CONTAINER */
.container{max-width:1100px;margin:0 auto;padding:0 20px}

/* FIX: allow Before & After gallery to use full width on desktop */
.section.gallery-full .container{
  max-width:100%;
}

.center{text-align:center}

/* HEADER */
.site-header{
  position:sticky;top:0;
  background:rgba(255,235,0,0.96);
  border-bottom:2px solid #0002;
  z-index:20;
}
.header-row{
  display:flex;justify-content:space-between;align-items:center;
  padding:12px 0;
}
.nav a{
  margin:0 10px;text-decoration:none;color:var(--text);font-weight:700;
  font-size:14px;
}
.button{
  display:inline-block;padding:12px 18px;border-radius:12px;
  font-weight:900;text-decoration:none;
}
.button--primary{
  background:var(--green);
  color:#fff;
}

/* HERO */
.hero{
  padding:56px 0 40px;
  text-align:center;
}
.hero h1{
  font-size:clamp(30px,4vw,40px);
  font-weight:900;
  margin:0 0 15px;
}
.hero p{
  max-width:650px;
  margin:0 auto 20px;
  font-size:17px;
}
.hero img{
  max-width:380px;
  width:80%;
  display:block;
  margin:28px auto 14px;
}
.hero-icons{
  font-size:14px;
  margin-top:4px;
}

/* SECTIONS */
.section{padding:56px 0;border-top:2px solid #0002}
.section--tint{background:var(--tint)}

/* CARDS */
.cards{display:grid;gap:18px}
@media(min-width:860px){ .cards{grid-template-columns:repeat(3,1fr);} }

.card{
  background:#fff;border-radius:12px;padding:20px;
  box-shadow:0 6px 16px #0002;
}

.price{font-size:32px;font-weight:900;color:var(--green);}
.small{font-size:13px;opacity:.7}

/* BEFORE & AFTER – CONSISTENT SLIDER (MOBILE + DESKTOP) */

.ba-slider {
  display: flex;
  justify-content: flex-start;
  overflow-x: auto;
  gap: 24px;
  padding: 16px 20px;
  scroll-snap-type: x mandatory;
  max-width: 100%;
  margin: 0 auto;
}

.ba-pair {
  flex: 0 0 360px;
  max-width: 360px;
  scroll-snap-align: center;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.ba-card{
  background: #fff;
  border-radius: 18px;
  padding: 12px 12px 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.18);
  position: relative;
}

.ba-card img{
  width: 100%;
  height: auto;
  max-height: 70vh;
  object-fit: contain;
  display: block;
  border-radius: 14px;
  background: #000;
}

.ba-label{
  position:absolute;
  top:10px;left:16px;
  padding:6px 14px;
  border-radius:999px;
  font-size:13px;
  font-weight:700;
  color:#fff;
}
.ba-label--before{background:#c0392b;}
.ba-label--after{background:var(--green);}

@media (min-width:768px){
  .ba-slider{justify-content:center;}
  .ba-pair{flex:0 0 45%;max-width:420px;}
}

/* REVIEWS */
.review-slider{
  display:flex;overflow-x:auto;scroll-snap-type:x mandatory;
  gap:20px;padding-bottom:10px;
}
.review-card{
  scroll-snap-align:start;
  min-width:260px;max-width:260px;
  background:#fff;padding:18px;border-radius:12px;
  box-shadow:0 4px 14px #0002;
  font-size:15px;
}
.review-stars{font-size:16px;color:var(--green);margin-bottom:6px;}
.review-name{margin-top:8px;font-weight:700;color:var(--green);}

/* FAQ */
#faq h3{margin-top:26px;margin-bottom:6px;}

/* SOCIAL ICONS */
.social-links {
  margin-top: 25px;
  display: flex;
  justify-content: center;
  gap: 14px;
}

.social-links img {
  width: 64px;
  height: 64px;
  object-fit: contain;
  display: block;
  transition: transform .2s ease;
}

.circle {
  padding: 2px;
  border-radius: 50%;
  background: #ffffff;
  box-shadow: 0 2px 6px #0002;
}

.social-links a:hover img {
  transform: scale(1.15);
}

/* FLOATING BOOK NOW BUTTON */
.floating-book-btn{
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  background: var(--green);
  color: #ffffff;
  font-weight: 900;
  font-size: 16px;
  padding: 14px 22px;
  border-radius: 999px;
  text-decoration: none;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

@media (max-width: 768px){
  .floating-book-btn{
    bottom: 70px;
    right: 15px;
    font-size: 15px;
  }
}
</style>

<script>
  const toggle = document.querySelector('.menu-toggle');
  const nav = document.querySelector('.nav');
  const overlay = document.querySelector('.menu-overlay');

  toggle.addEventListener('click', () => {
    nav.classList.toggle('open');
    overlay.classList.toggle('active');
    document.body.classList.toggle('menu-open');
  });

  overlay.addEventListener('click', () => {
    nav.classList.remove('open');
    overlay.classList.remove('active');
    document.body.classList.remove('menu-open');
  });

  nav.querySelectorAll('a').forEach(link => {
    link.addEventListener('click', () => {
      nav.classList.remove('open');
      overlay.classList.remove('active');
      document.body.classList.remove('menu-open');
    });
  });
</script>
