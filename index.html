<style>
/* =========================
   BRAND COLOURS & GLOBALS
========================= */
:root {
  --bg: #ffeb00;
  --tint: #fff27a;
  --text: #111827;
  --green: #0f7a37;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: var(--bg);
  color: var(--text);
}

.container {
  max-width: 1100px;
  margin: 0 auto;
  padding: 0 20px;
}

.center {
  text-align: center;
}

/* =========================
   HEADER
========================= */
.site-header {
  position: sticky;
  top: 0;
  background: rgba(255,235,0,0.96);
  border-bottom: 2px solid #0002;
  z-index: 20;
}

.header-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 0;
}

.nav a {
  margin: 0 10px;
  text-decoration: none;
  color: var(--text);
  font-weight: 700;
  font-size: 14px;
}

/* =========================
   BUTTONS
========================= */
.button {
  display: inline-block;
  padding: 12px 18px;
  border-radius: 12px;
  font-weight: 900;
  text-decoration: none;
}

.button--primary {
  background: var(--green);
  color: #fff;
}

/* =========================
   HERO
========================= */
.hero {
  padding: 56px 0 40px;
  text-align: center;
}

.hero h1 {
  font-size: clamp(30px, 4vw, 40px);
  font-weight: 900;
  margin-bottom: 15px;
}

.hero p {
  max-width: 650px;
  margin: 0 auto 20px;
  font-size: 17px;
}

.hero img {
  max-width: 380px;
  width: 80%;
  display: block;
  margin: 28px auto 14px;
}

/* =========================
   SECTIONS
========================= */
.section {
  padding: 56px 0;
  border-top: 2px solid #0002;
}

.section--tint {
  background: var(--tint);
}

/* =========================
   CARDS
========================= */
.cards {
  display: grid;
  gap: 18px;
}

@media (min-width: 860px) {
  .cards {
    grid-template-columns: repeat(3, 1fr);
  }
}

.card {
  background: #fff;
  border-radius: 12px;
  padding: 20px;
  box-shadow: 0 6px 16px #0002;
}

.price {
  font-size: 32px;
  font-weight: 900;
  color: var(--green);
}

.small {
  font-size: 13px;
  opacity: 0.7;
}

/* =========================
   BEFORE & AFTER – FIXED
========================= */

/* allow gallery section to go full width */
.section.gallery-full .container {
  max-width: 100%;
}

/* horizontal slider – works on desktop & mobile */
.ba-slider {
  display: flex;
  flex-wrap: nowrap;
  gap: 24px;
  overflow-x: auto;
  padding: 20px;
  scroll-snap-type: x mandatory;
}

/* each before/after pair */
.ba-pair {
  flex: 0 0 360px;
  scroll-snap-align: center;
  display: flex;
  flex-direction: column;
  gap: 14px;
}

/* card styling */
.ba-card {
  background: #fff;
  border-radius: 18px;
  padding: 12px 12px 16px;
  box-shadow: 0 8px 20px rgba(0,0,0,0.18);
  position: relative;
}

/* image control – NO GIANT IMAGES */
.ba-card img {
  width: 100%;
  height: auto;
  max-height: 70vh;
  object-fit: contain;
  display: block;
  border-radius: 14px;
  background: #000;
}

/* labels */
.ba-label {
  position: absolute;
  top: 10px;
  left: 16px;
  padding: 6px 14px;
  border-radius: 999px;
  font-size: 13px;
  font-weight: 700;
  color: #fff;
}

.ba-label--before {
  background: #c0392b;
}

.ba-label--after {
  background: var(--green);
}

/* =========================
   REVIEWS
========================= */
.review-slider {
  display: flex;
  gap: 20px;
  overflow-x: auto;
  scroll-snap-type: x mandatory;
  padding-bottom: 10px;
}

.review-card {
  scroll-snap-align: start;
  min-width: 260px;
  max-width: 260px;
  background: #fff;
  padding: 18px;
  border-radius: 12px;
  box-shadow: 0 4px 14px #0002;
}

.review-stars {
  font-size: 16px;
  color: var(--green);
  margin-bottom: 6px;
}

.review-name {
  margin-top: 8px;
  font-weight: 700;
  color: var(--green);
}

/* =========================
   SOCIAL ICONS
========================= */
.social-links {
  margin-top: 25px;
  display: flex;
  justify-content: center;
  gap: 14px;
}

.social-links img {
  width: 64px;
  height: 64px;
  object-fit: contain;
  border-radius: 50%;
  background: #fff;
  box-shadow: 0 2px 6px #0002;
  transition: transform 0.2s ease;
}

.social-links a:hover img {
  transform: scale(1.15);
}

/* =========================
   FLOATING BOOK BUTTON
========================= */
.floating-book-btn {
  position: fixed;
  bottom: 20px;
  right: 20px;
  z-index: 9999;
  background: var(--green);
  color: #fff;
  font-weight: 900;
  padding: 14px 22px;
  border-radius: 999px;
  text-decoration: none;
  box-shadow: 0 8px 20px rgba(0,0,0,0.25);
}

/* =========================
   MOBILE NAV
========================= */
.menu-toggle {
  display: none;
  background: none;
  border: none;
  cursor: pointer;
}

.menu-toggle span {
  display: block;
  width: 26px;
  height: 3px;
  background: #111;
  margin: 5px 0;
  border-radius: 2px;
}

@media (max-width: 900px) {
  .menu-toggle {
    display: block;
  }

  .nav {
    position: absolute;
    top: 100%;
    left: 0;
    right: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.35s ease;
  }

  .nav.open {
    max-height: 400px;
  }
}
</style>
